# Version

# Uses FreeBSD ports Tree fonts and file paths.
version=1

# Component Font Mappings

dialog.plain.latin-1=DejaVu Sans

dialog.bold.latin-1=DejaVu Sans Bold

dialog.italic.latin-1=DejaVu Sans Oblique

dialog.bolditalic.latin-1=DejaVu Sans Bold Oblique


sansserif.plain.latin-1=DejaVu Sans

sansserif.bold.latin-1=DejaVu Sans Bold

sansserif.italic.latin-1=DejaVu Sans Oblique

sansserif.bolditalic.latin-1=DejaVu Sans Bold Oblique


serif.plain.latin-1=DejaVu Serif

serif.bold.latin-1=DejaVu Serif Bold

serif.italic.latin-1=DejaVu Serif Italic

serif.bolditalic.latin-1=DejaVu Serif Bold Italic


monospaced.plain.latin-1=DejaVu Sans Mono

monospaced.bold.latin-1=DejaVu Sans Mono Bold

monospaced.italic.latin-1=DejaVu Sans Mono Oblique

monospaced.bolditalic.latin-1=DejaVu Sans Mono Bold Oblique


dialoginput.plain.latin-1=DejaVu Sans Mono

dialoginput.bold.latin-1=DejaVu Sans Mono Bold

dialoginput.italic.latin-1=DejaVu Sans Mono Oblique

dialoginput.bolditalic.latin-1=DejaVu Sans Mono Bold Oblique

# Search Sequences

sequence.allfonts=latin-1

# Font File Names

## FIXME: Should not hardcode /usr/local
filename.DejaVu_Sans=/data/jvm/lib/fonts/DejaVuSans.ttf
filename.DejaVu_Sans_Bold=/data/jvm/lib/fonts/DejaVuSans-Bold.ttf
filename.DejaVu_Sans_Oblique=/data/jvm/lib/fonts/DejaVuSans-Oblique.ttf
filename.DejaVu_Sans_Bold_Oblique=/data/jvm/lib/fonts/DejaVuSans-BoldOblique.ttf

filename.DejaVu_Sans_Mono=/data/jvm/lib/fonts/DejaVuSansMono.ttf
filename.DejaVu_Sans_Mono_Bold=/data/jvm/lib/fonts/DejaVuSansMono-Bold.ttf
filename.DejaVu_Sans_Mono_Oblique=/data/jvm/lib/fonts/DejaVuSansMono-Oblique.ttf
filename.DejaVu_Sans_Mono_Bold_Oblique=/data/jvm/lib/fonts/DejaVuSansMono-BoldOblique.ttf

filename.DejaVu_Serif=/data/jvm/lib/fonts/DejaVuSerif.ttf
filename.DejaVu_Serif_Bold=/data/jvm/lib/fonts/DejaVuSerif-Bold.ttf
filename.DejaVu_Serif_Italic=/data/jvm/lib/fonts/DejaVuSerif-Italic.ttf
filename.DejaVu_Serif_Bold_Italic=/data/jvm/lib/fonts/DejaVuSerif-BoldItalic.ttf

